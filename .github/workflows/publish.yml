name: Publish NQX
# source: 47471f09c3f635774d393d6692f77b66de884e4f

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout NQX source
        uses: actions/checkout@v4
        with:
          repository: peace01271989-source/NQX
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build latest NQX
        env:
          GITHUB_PAGES: 'true'
        run: npm run build

      - name: Prepare public site
        shell: bash
        run: |
          set -euo pipefail
          SITE_DIR="$RUNNER_TEMP/site"
          rm -rf "$SITE_DIR"
          mkdir -p "$SITE_DIR"
          cp -a dist/. "$SITE_DIR/"
          (grep -rlZ '/NQX/' "$SITE_DIR" --exclude='*.png' --exclude='*.webp' 2>/dev/null || true) | xargs -0 -r sed -i 's#/NQX/#/-NQX-PUBLIC/#g'
          (grep -rlZ "url('/nqx-field-bg.webp')" "$SITE_DIR" 2>/dev/null || true) | xargs -0 -r sed -i "s#url('/nqx-field-bg.webp')#url('/-NQX-PUBLIC/nqx-field-bg.webp')#g"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
