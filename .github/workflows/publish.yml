name: Publish NQX

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare public build
        shell: bash
        run: |
          set -euo pipefail
          SITE_DIR="$RUNNER_TEMP/site"
          mkdir -p "$SITE_DIR"
          curl -L --fail --retry 3 \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/peace01271989-source/NQX/actions/artifacts/11351125917/zip' \
            -o "$RUNNER_TEMP/build.zip"
          unzip -q "$RUNNER_TEMP/build.zip" -d "$SITE_DIR"
          grep -rlZ '/NQX/' "$SITE_DIR" --exclude='*.png' --exclude='*.webp' 2>/dev/null | xargs -0 -r sed -i 's#/NQX/#/-NQX-PUBLIC/#g'
          grep -rlZ "url('/nqx-field-bg.webp')" "$SITE_DIR" 2>/dev/null | xargs -0 -r sed -i "s#url('/nqx-field-bg.webp')#url('/-NQX-PUBLIC/nqx-field-bg.webp')#g"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
