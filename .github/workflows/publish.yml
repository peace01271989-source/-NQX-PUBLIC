name: Publish NQX

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare public build
        shell: bash
        run: |
          set -euo pipefail
          SITE_DIR="$RUNNER_TEMP/site"
          mkdir -p "$SITE_DIR" "$RUNNER_TEMP/artifact"
          curl -L --fail --retry 3 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-7080-820b-a442-e2debd79eb16/raw?se=2026-10-05T01%3A37%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=765235f5-645d-5cf1-ac3a-5646018f62de&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T22%3A24%3A36Z&ske=2026-10-05T22%3A24%3A36Z&sks=b&skv=2026-02-06&sig=WBp5E8mCI6jwcEjsFB4eaGcjST/ly5dGgWagMy7aAX4%3D' -o "$RUNNER_TEMP/build.zip"
          unzip -q "$RUNNER_TEMP/build.zip" -d "$RUNNER_TEMP/artifact"
          tar -xf "$RUNNER_TEMP/artifact/artifact.tar" -C "$SITE_DIR"
          grep -rlZ '/NQX/' "$SITE_DIR" --exclude='*.png' --exclude='*.webp' 2>/dev/null | xargs -0 -r sed -i 's#/NQX/#/-NQX-PUBLIC/#g'

      - name: Enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
