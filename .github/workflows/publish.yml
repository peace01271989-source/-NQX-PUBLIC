name: Publish NQX

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare public build
        shell: bash
        run: |
          set -euo pipefail
          SITE_DIR="$RUNNER_TEMP/site"
          mkdir -p "$SITE_DIR" "$RUNNER_TEMP/artifact"
          curl -L --fail --retry 3 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-0794-820b-80e8-396cfe35ceb9/raw?se=2026-10-05T01%3A49%3A44Z&sp=r&sv=2026-02-06&sr=b&scid=9df560db-e4bc-578e-b09e-300a5bb19a4f&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T21%3A56%3A30Z&ske=2026-10-05T21%3A56%3A30Z&sks=b&skv=2026-02-06&sig=42QB0eZrRPxpO1RZIHYq6jowKWk2g4ocqk14c8ZRZn0%3D' -o "$RUNNER_TEMP/build.zip"
          unzip -q "$RUNNER_TEMP/build.zip" -d "$RUNNER_TEMP/artifact"
          tar -xf "$RUNNER_TEMP/artifact/artifact.tar" -C "$SITE_DIR"
          grep -rlZ '/NQX/' "$SITE_DIR" --exclude='*.png' --exclude='*.webp' 2>/dev/null | xargs -0 -r sed -i 's#/NQX/#/-NQX-PUBLIC/#g'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
